<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="auto" role="img" aria-label="Agent internals: local ReAct loop and cloud LangGraph paths">
  <style>
    .bg { fill: #F7F7F8; }
    .box { fill: #FFFFFF; stroke: #D8D8DE; stroke-width: 1; }
    .focal { fill: #FFFFFF; stroke: #0AB861; stroke-width: 2; }
    .zone { fill: none; stroke: #C9C9D0; stroke-width: 1; stroke-dasharray: 5 4; }
    .t { fill: #171717; font-family: 'Segoe UI', 'PingFang SC', sans-serif; font-size: 14px; font-weight: 600; }
    .s { fill: #52525B; font-family: 'Segoe UI', 'PingFang SC', sans-serif; font-size: 12px; }
    .label { fill: #52525B; font-family: 'Segoe UI', 'PingFang SC', sans-serif; font-size: 12px; font-weight: 600; }
    .title { fill: #171717; font-family: 'Segoe UI', 'PingFang SC', sans-serif; font-size: 18px; font-weight: 600; }
    .cap { fill: #52525B; font-family: 'Segoe UI', 'PingFang SC', sans-serif; font-size: 12px; }
    .arr { stroke: #8A8A94; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .loop { stroke: #02743B; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#8A8A94"/>
    </marker>
    <marker id="a4b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#02743B"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="660"/>
  <text class="title" x="40" y="44">Agent internals — where the work happens</text>
  <text class="cap" x="40" y="66">C# assembles facts and routes; loops run locally in C# or in Python for cloud models.</text>

  <rect class="box" x="40" y="110" width="920" height="56" rx="8"/>
  <text class="t" x="56" y="134">Shared prep (C#) · AgentOrchestrator</text>
  <text class="s" x="56" y="154">intent classification · context assembly · token budget · planning knowledge</text>

  <path class="arr" d="M260 166 V200" marker-end="url(#a4)"/>
  <path class="arr" d="M740 166 V200" marker-end="url(#a4)"/>

  <rect class="zone" x="40" y="200" width="440" height="190" rx="10"/>
  <text class="label" x="56" y="222">LOCAL · C# ReActLoopEngine</text>

  <rect class="box" x="64" y="242" width="140" height="44" rx="8"/>
  <text class="t" x="78" y="269">Thought</text>

  <rect class="box" x="64" y="310" width="190" height="44" rx="8"/>
  <text class="t" x="78" y="337">Tool call (MCP)</text>

  <rect class="box" x="280" y="310" width="140" height="44" rx="8"/>
  <text class="t" x="294" y="337">Observation</text>

  <path class="arr" d="M134 286 V310" marker-end="url(#a4)"/>
  <path class="arr" d="M254 332 H280" marker-end="url(#a4)"/>
  <path class="loop" d="M420 332 H448 V264 H204" marker-end="url(#a4b)"/>

  <rect class="box" x="40" y="406" width="440" height="46" rx="8"/>
  <text class="t" x="56" y="434">Validate → repair</text>
  <text class="s" x="420" y="434" text-anchor="end">errors ↺ max 2</text>

  <rect class="zone" x="520" y="200" width="440" height="190" rx="10"/>
  <text class="label" x="536" y="222">CLOUD · Python supervisor</text>

  <rect class="box" x="540" y="242" width="390" height="44" rx="8"/>
  <text class="t" x="556" y="269">supervisor (LangGraph)</text>
  <text class="s" x="760" y="269">deterministic routing</text>

  <rect class="box" x="540" y="310" width="390" height="52" rx="8"/>
  <text class="t" x="556" y="333">coder ↔ reviewer ↔ compiler</text>
  <text class="s" x="556" y="352">compile errors return to coder · rounds capped</text>

  <path class="arr" d="M740 286 V310" marker-end="url(#a4)"/>
  <path class="loop" d="M930 336 H944 V264 H930" marker-end="url(#a4b)"/>

  <rect class="box" x="520" y="406" width="440" height="64" rx="8"/>
  <text class="t" x="536" y="432">planner → ProjectPlan DAG → executor</text>
  <text class="s" x="536" y="452">skeleton → refine · topological per-block execution</text>

  <rect class="box" x="520" y="484" width="440" height="48" rx="8"/>
  <text class="t" x="536" y="513">milestones: approve / adjust / reject · resume</text>

  <path class="arr" d="M260 390 V406" marker-end="url(#a4)"/>
  <path class="arr" d="M260 452 V560" marker-end="url(#a4)"/>
  <path class="arr" d="M740 390 V406" marker-end="url(#a4)"/>
  <path class="arr" d="M740 470 V484" marker-end="url(#a4)"/>
  <path class="arr" d="M740 532 V560" marker-end="url(#a4)"/>

  <rect class="focal" x="40" y="560" width="920" height="60" rx="8"/>
  <text class="t" x="56" y="585">WriteGate → Diff → Openness import + compile</text>
  <text class="s" x="56" y="605">C# STA · every write converges here</text>
</svg>
